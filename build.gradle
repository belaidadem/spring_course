


plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4'  // Add this line
    id 'io.spring.dependency-management' version '1.1.4'  // Add this line

}

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

compileJava {
    options.compilerArgs << '-parameters'
}

group = 'spring.course'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {// https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-web
    implementation("org.springframework.boot:spring-boot-starter-web:3.4.4")
}

test {
    useJUnitPlatform()
}